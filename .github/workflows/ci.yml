name: CI

# 全栈 CI: Java 单测 / Python 单测 / 前端类型检查+构建
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Java 17 / Maven test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steelguard-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B test

  ai-service:
    name: Python 3.11 / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU torch first (avoid 900MB CUDA wheel)
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        # 不用 pip install -e .: pyproject 未声明 build-system, 直接装运行时依赖即可
        run: |
          pip install \
            "fastapi>=0.115.0" "uvicorn[standard]>=0.30.0" "pydantic>=2.7.0" \
            "pydantic-settings>=2.3.0" "httpx>=0.27.0" "python-multipart>=0.0.12" \
            "pillow>=12.3.0" "minio>=7.2.20" "pymysql>=1.2.0" "albumentations>=2.0.8" \
            "ultralytics>=8.3.0" "onnxruntime>=1.20.0" "openai>=1.50.0" \
            "pymilvus>=2.4.9,<2.5" "setuptools<81" "marshmallow<4" \
            "jsonschema>=4.23.0" "prometheus-fastapi-instrumentator>=7.0.0" \
            "pytest>=8.0.0"
      - name: Run pytest
        run: python -m pytest -q

  ui:
    name: Node 20 / Vue build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: steelguard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: steelguard-ui/package-lock.json
      - run: npm ci
      - run: npm run build
