# ==========================================================================
# SteelGuard 全栈编排
#
# 仅基础设施(MySQL/Redis/MinIO): docker compose up -d
# 全栈 GPU(本机有 N 卡 + Docker GPU 支持): docker compose --profile gpu up -d --build
# 全栈 CPU(任意机器, 推理较慢):          docker compose --profile cpu up -d --build
#
# 注意: gpu / cpu 两个 profile 互斥(共享网络别名 ai-service), 不要同时启用。
#       首次启动 MySQL 空卷会自动执行 db/*.sql + admin 种子(admin/admin123)。
# ==========================================================================

name: steelguard

# AI 服务公共环境(容器内服务发现走容器名; 预签名走宿主可达的对外端点)
x-ai-env: &ai-common-env
  TZ: Asia/Shanghai
  # MinIO 内部 I/O 端点
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-steelguard}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-steelguard123}
  # 预签名 URL 对外端点(浏览器/拉图); Docker Desktop 用 host.docker.internal,
  # Linux 原生 Docker 请在 .env 中改为宿主 IP
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-host.docker.internal:9000}
  DEFECT_BUCKET: defect-images
  # MySQL(容器网络内走默认端口 3306, 不是宿主机映射端口)
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_DATABASE: ${MYSQL_DATABASE:-steelguard}
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-steelguard123}
  # Milvus
  MILVUS_HOST: milvus
  MILVUS_PORT: 19530
  # 百炼 Qwen Key 可选; 留空时 VL 对决与 LLM 报告降级, 不影响 YOLO/溯源
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  VL_PROVIDER: dashscope
  OLLAMA_BASE_URL: http://ollama:11434/v1
  # 推理参数
  YOLO_WEIGHTS: weights/best.pt
  YOLO_IMGSZ: 224

x-ai-depends: &ai-common-depends
  mysql:
    condition: service_healthy
  minio:
    condition: service_healthy
  milvus:
    condition: service_healthy

services:
  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: steelguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-steelguard123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-steelguard}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-4406}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 全新空卷首次初始化(已有数据卷不受影响; 启动顺序按文件名字典序)
      - ./steelguard-backend/steelguard-admin-api/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./steelguard-backend/steelguard-admin-api/src/main/resources/db/schema-v1_dataset.sql:/docker-entrypoint-initdb.d/02-schema-v1-dataset.sql:ro
      - ./steelguard-backend/steelguard-admin-api/src/main/resources/db/schema-v4_inspection.sql:/docker-entrypoint-initdb.d/03-schema-v4-inspection.sql:ro
      - ./docker/mysql-init/04-admin-seed.sql:/docker-entrypoint-initdb.d/04-admin-seed.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-steelguard123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== Redis 7 ==========
  redis:
    image: redis:7-alpine
    container_name: steelguard-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass ${REDIS_PASSWORD:-steelguard123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-steelguard123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== MinIO (缺陷图像对象存储) ==========
  minio:
    image: minio/minio:latest
    container_name: steelguard-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-steelguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-steelguard123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 初始化 MinIO bucket (一次性)
  minio-init:
    image: minio/mc:latest
    container_name: steelguard-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-steelguard} ${MINIO_ROOT_PASSWORD:-steelguard123};
      mc mb local/defect-images --ignore-existing;
      mc mb local/datasets --ignore-existing;
      mc mb local/models --ignore-existing;
      echo 'MinIO buckets initialized.';
      "

  # ========== Milvus 依赖: etcd (全栈 gpu/cpu profile) ==========
  milvus-etcd:
    profiles: ["gpu", "cpu"]
    image: quay.io/coreos/etcd:v3.5.16
    container_name: steelguard-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== Milvus 2.4.17 (复用本项目 MinIO 作为对象存储后端) ==========
  milvus:
    profiles: ["gpu", "cpu"]
    image: milvusdb/milvus:v2.4.17
    container_name: steelguard-milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-steelguard}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-steelguard123}
      MINIO_BUCKET_NAME: milvus-bucket
      MINIO_USE_SSL: "false"
      COMMON_STORAGETYPE: local
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ========== Python AI 服务: GPU 模式(cu126 torch, 需 NVIDIA 容器支持) ==========
  ai-service-gpu:
    profiles: ["gpu"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: https://mirrors.sjtug.sjtu.edu.cn/pytorch-wheels/cu126
    image: steelguard-ai-service:gpu
    container_name: steelguard-ai-gpu
    restart: unless-stopped
    environment:
      <<: *ai-common-env
      MODEL_DEVICE: cuda:0
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    depends_on: *ai-common-depends
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    networks:
      default:
        aliases:
          - ai-service

  # ========== Python AI 服务: CPU 模式(纯 CPU wheel, 任意机器可跑) ==========
  ai-service-cpu:
    profiles: ["cpu"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: https://mirrors.sjtug.sjtu.edu.cn/pytorch-wheels/cpu
    image: steelguard-ai-service:cpu
    container_name: steelguard-ai-cpu
    restart: unless-stopped
    environment:
      <<: *ai-common-env
      MODEL_DEVICE: cpu
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    depends_on: *ai-common-depends
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - ai-service

  # ========== Java 后端 ==========
  backend:
    profiles: ["gpu", "cpu"]
    build:
      context: ./steelguard-backend
      dockerfile: ../docker/backend.Dockerfile
    image: steelguard-admin-api:latest
    container_name: steelguard-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      BACKEND_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-steelguard}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-steelguard123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-steelguard123}
      # 容器内 I/O 用 MinIO 内部端点; 预签名用对外端点
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-steelguard}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-steelguard123}
      AI_SERVICE_URL: http://ai-service:8001
      JWT_SECRET: ${JWT_SECRET:-steelguard-jwt-secret-change-me-in-production-2026}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      ai-service-gpu:
        condition: service_healthy
        required: false
      ai-service-cpu:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ========== 前端(nginx 静态托管 + /api 反代) ==========
  frontend:
    profiles: ["gpu", "cpu"]
    build:
      context: ./steelguard-ui
      dockerfile: Dockerfile
    image: steelguard-ui:latest
    container_name: steelguard-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ========== 阶段5.2: Prometheus 指标采集(随 gpu/cpu 全栈启动) ==========
  prometheus:
    profiles: ["gpu", "cpu"]
    image: prom/prometheus:v2.54.1
    container_name: steelguard-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
        required: false
      ai-service-gpu:
        condition: service_healthy
        required: false
      ai-service-cpu:
        condition: service_healthy
        required: false

  # ========== 阶段5.2: Grafana 看板(admin/admin, 数据源+仪表盘自动预置) ==========
  grafana:
    profiles: ["gpu", "cpu"]
    image: grafana/grafana:11.3.0
    container_name: steelguard-grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # 可写: UI 上调整看板可直接落盘到宿主目录
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  # ========== 可选: Ollama (本地大模型兜底, --profile ollama) ==========
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: steelguard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:
  prometheus_data:
  grafana_data:
  ollama_data:
